{% extends "base.html" %}
{% block title %}Log in – Home HQ{% endblock %}
{% block guest_content %}
  <div class="login-shell">
    <div>
      <a class="wordmark" href="{{ url_for('login') }}">
        <span class="wordmark__title">Home HQ</span>
        <span class="wordmark__tag">household ledger</span>
      </a>
      <div class="card card--narrow">
        <h1 class="card__title">Sign in</h1>
        <hr class="card__rule">
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('login') }}">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn--primary" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
