# Initial HTTP-only server block for Home HQ.
#
# Deploy this first, confirm it works over plain HTTP, then run:
#   sudo certbot --nginx -d homehq.yourdomain.com
# certbot will rewrite this file to add the HTTPS server block, the
# TLS cert paths, and an HTTP -> HTTPS redirect automatically.
#
# Replace homehq.yourdomain.com below with your real subdomain first.

server {
    listen 80;
    server_name homehq.yourdomain.com;

    client_max_body_size 10M;

    location /static/ {
        alias /home/homehq/homehq/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
